version: '3.8'

services:
  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rest-api-app
    ports:
      - "8080:8080"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=restapi
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - SERVER_PORT=8080
    depends_on:
      - mysql
    networks:
      - rest-api-network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: rest-api-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=restapi
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - rest-api-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

networks:
  rest-api-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local